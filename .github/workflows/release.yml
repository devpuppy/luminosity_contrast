name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version such as 0.3.0" >&2
            exit 1
          fi
          ruby -e 'require_relative "lib/luminosity_contrast/version"; abort "Version does not match master" unless LuminosityContrast::VERSION == ENV.fetch("RELEASE_VERSION")'
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to move it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --verify-tag=false
